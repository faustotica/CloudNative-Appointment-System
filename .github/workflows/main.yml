name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore dependencies
      run: dotnet restore AppointmentManager.slnx
      
    - name: Build
      run: dotnet build AppointmentManager.slnx --no-restore
      
    - name: Test
      run: dotnet test AppointmentManager.slnx --no-build --verbosity normal

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Build API Docker Image
      run: docker build -t appointmentmanager-api -f AppointmentManager.API/Dockerfile .
      
    - name: Build Worker Docker Image
      run: docker build -t appointmentmanager-worker -f AppointmentManager.Worker/Dockerfile .
